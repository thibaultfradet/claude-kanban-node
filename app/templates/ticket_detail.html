<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>#{{ ticket.id }} — {{ ticket.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css?v=7" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="page">
    <header class="page-header">
      <div class="brand">
        <a href="/" class="btn-icon" aria-label="Retour au board">←</a>
        <div>
          <div class="eyebrow">Ticket #{{ ticket.id }}</div>
          <h1>Claude Kanban</h1>
        </div>
      </div>
    </header>

    <div class="modal modal-standalone">
      <div class="modal-body" id="standalone-ticket">
        {% include "_ticket_fragment.html" %}
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="/static/app.js?v=7"></script>
  <script>
    window.KanbanDecor.apply(document.getElementById("standalone-ticket"));
    window.KanbanTicket.bind(document.getElementById("standalone-ticket"), {{ ticket.id }});
  </script>
</body>
</html>
